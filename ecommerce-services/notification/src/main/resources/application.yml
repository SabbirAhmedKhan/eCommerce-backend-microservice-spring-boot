spring:
 application:
  name: "notification"
 config:
  import: "optional:configserver:http://localhost:8888/"

management:
 endpoints:
  web:
   exposure:
    include: "*"
 info:
  env:
   enabled: true
 endpoint:
  access: unrestricted

eureka:
 instance:
  preferIpAddress: true
 client:
  fetchRegistry: true
  registerWithEureka: true
  serviceUrl:
   defaultZone: http://localhost:8070/eureka/

info:
 app:
  name: "Notification Service"
  description: "Notification Service"
  version: "1.0.0"
