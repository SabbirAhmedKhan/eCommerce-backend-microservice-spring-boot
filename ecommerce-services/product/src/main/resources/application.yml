build:
    version: "3.0.0"

customer:
    message: "Welcome to customer service"
    contactDetails:
        name: "sabbir"
        email: "sabbir@in.com"
        phone: "1234567890"
    onCallSupport:
        - 012587
        - 012588


management:
    endpoints:
        web:
            exposure:
                include: "*"
    info:
        env:
            enabled: true
    endpoint:
        access: unrestricted


eureka:
    instance:
        preferIpAddress: true
    client:
        fetchRegistry: true
        registerWithEureka: true
        serviceUrl:
            defaultZone: http://localhost:8070/eureka/

info:
    app:
        name: "Product"
        description: "Product Service"
        version: "1.0.0"




