spring:
 application:
  name: "payment"
 config:
  import: optional:configserver:http://localhost:8888

management:
 endpoints:
  web:
   exposure:
    include: "*"
 info:
  env:
   enabled: true
 endpoint:
  access: unrestricted


eureka:
 instance:
  preferIpAddress: true
 client:
  fetchRegistry: true
  registerWithEureka: true
  serviceUrl:
   defaultZone: http://localhost:8070/eureka/

info:
 app:
  name: "Payment"
  description: "Payment Service"
  version: "1.0.0"
