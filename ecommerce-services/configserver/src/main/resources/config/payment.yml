server:
 port: 8060
spring:
 datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://localhost:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false
  username: root
  password: root
 jpa:
  generate-ddl: false
  hibernate:
   #            dialect: org.hibernate.dialect.MySQLDialect
   ddl-auto: update
  show-sql: true
  database-platform: org.hibernate.dialect.MySQLDialect
  open-in-view: false

